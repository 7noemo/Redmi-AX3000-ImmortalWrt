name: Build Redmi AX3000 (RA81)

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "ImmortalWrt branch"
        required: true
        default: "master"
        type: choice
        options:
          - master
          - openwrt-25.12
  push:
    branches: [main]
    paths:
      - "configs/**"
      - "scripts/**"
      - "files/**"
      - ".github/workflows/build.yml"
  schedule:
    # weekly, Monday 03:00 UTC - keeps a fresh image without rebuilding daily
    - cron: "0 3 * * 1"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: ${{ github.event.inputs.source_branch || 'master' }}
  BOARD_SUPPORT: https://github.com/7noemo/ra81-support.git
  CONFIG_FILE: configs/ra81.config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo -n true && df -h / | tail -1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-yaml rsync unzip zlib1g-dev \
            file wget subversion device-tree-compiler swig

      - name: Clone ImmortalWrt (${{ env.REPO_BRANCH }})
        run: |
          git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          echo "HEAD: $(git log --oneline -1)"
          echo "KERNEL: $(grep -m1 KERNEL_PATCHVER target/linux/qualcommax/Makefile)"

      - name: Install RA81 board support
        run: |
          git clone --depth 1 "$BOARD_SUPPORT" board-support
          ./board-support/scripts/install-into-openwrt.sh "$GITHUB_WORKSPACE/openwrt"
          # board-level overlay (radio defaults, diagnostics)
          mkdir -p openwrt/files
          cp -rv files/. openwrt/files/
          chmod 0755 openwrt/files/etc/uci-defaults/99-ra81-wifi \
                       openwrt/files/usr/sbin/ra81-wifi-diag

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config
        run: |
          cd openwrt
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          make defconfig
          echo "=== device selection ==="
          grep -E "CONFIG_TARGET_qualcommax.*DEVICE_redmi_ax3000" .config || true

      - name: Verify critical symbols
        run: |
          cd openwrt
          fail=0
          need="
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_redmi_ax3000=y
          CONFIG_PACKAGE_kmod-ath11k-ahb=y
          CONFIG_PACKAGE_ath11k-firmware-ipq5018-qcn6122=y
          CONFIG_PACKAGE_ipq-wifi-redmi_ax3000=y
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y
          "
          for sym in $need; do
            if grep -qx "$sym" .config; then
              echo "  OK   $sym"
            else
              echo "::error::missing $sym"
              fail=1
            fi
          done
          # qca8k is built into the kernel (NET_DSA_QCA8K), not a kmod package
          if grep -qE "^CONFIG_NET_DSA_QCA8K=y" .config; then
            echo "  OK   CONFIG_NET_DSA_QCA8K=y (in-kernel DSA)"
          else
            echo "::warning::NET_DSA_QCA8K not set - switch ports will not appear"
          fi
          exit $fail

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s

      - name: Compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Collect artifacts
        run: |
          mkdir -p out
          cd openwrt/bin/targets/qualcommax/ipq50xx
          ls -lh
          cp -v *redmi*ax3000* "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          cp -v *profile*.json sha256sums "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          # manifest doubles as the "what actually shipped" record
          cp -v *.manifest "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          echo "=== artifacts ==="
          ls -lh "$GITHUB_WORKSPACE/out/"

      - name: Wi-Fi package audit
        run: |
          f=$(ls openwrt/bin/targets/qualcommax/ipq50xx/*.manifest | head -1)
          [ -n "$f" ] || { echo "::error::no manifest"; exit 1; }
          echo ">>> ath11k / bdf / luci audit"
          for p in ath11k-firmware-ipq5018-qcn6122 ipq-wifi-redmi_ax3000 \
                   kmod-ath11k-ahb luci-i18n-base-zh-cn; do
            if grep -q "^$p " "$f"; then echo "  OK   $p"; else echo "::warning::not in image: $p"; fi
          done

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ra81-${{ env.REPO_BRANCH }}-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
